# ─── coturn configuration for Babyfunken ───────────────────────
# Relay-only. coturn never decrypts anything: WebRTC media stays
# end-to-end encrypted between the two devices, and this box only
# forwards packets it cannot read.

listening-port=3478
tls-listening-port=5349

# The address clients should be told to send relayed traffic to. On a
# cloud VM with a private NIC, set both.
# listening-ip=10.0.0.5
# external-ip=203.0.113.10/10.0.0.5

realm=babyfunken.de
server-name=turn.example.org

# Credentials are minted per session by the signaling server from this
# shared secret (RFC 7635 style). It MUST match TURN_SECRET in server/.env.
use-auth-secret
static-auth-secret=change-me-to-a-long-random-string

# TLS for the turns: endpoint, so relaying works on networks that only
# allow 443/5349 outbound.
cert=/certs/fullchain.pem
pkey=/certs/privkey.pem
cipher-list="ECDHE+AESGCM:ECDHE+CHACHA20:!aNULL:!MD5:!DSS"
no-tlsv1
no-tlsv1_1

# Ports coturn hands out for relays. Open this UDP range in the firewall.
min-port=49160
max-port=49200

# ── Hardening ──
# Deny relaying to private ranges: without this the relay can be used to
# reach services inside your own network.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# No long-term user database, no CLI, no web admin.
no-cli
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780

# Per-session ceilings, so one client cannot saturate the relay.
user-quota=12
total-quota=1200
bps-capacity=0
stale-nonce=600

# Log to stdout for the container runtime to collect.
log-file=stdout
no-stdout-log=false
simple-log
# Keep addresses out of the logs.
no-software-attribute
